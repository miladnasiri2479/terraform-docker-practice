name: 'Terraform CI'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Init (Dev)
      run: |
        cd environments/dev
        terraform init -backend=false

    - name: Terraform Plan (Dev)
      run: |
        cd environments/dev
        terraform plan -input=false -var-file="dev.tfvars" -var="db_password=${{ secrets.DB_PASSWORD }}"
